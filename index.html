<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Backgammon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #2c160b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="backgammonCanvas" width="800" height="1200"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('backgammonCanvas');
        const ctx = canvas.getContext('2d');

        function drawBoard() {
            // Tahta Arka Planı (Ahşap doku hissi)
            ctx.fillStyle = '#3d2314';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // İç Saha Alanı
            ctx.fillStyle = '#dcb35c';
            ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);

            // Orta Bar
            ctx.fillStyle = '#2b1509';
            ctx.fillRect(canvas.width / 2 - 25, 50, 50, canvas.height - 100);

            // Haneler (Üçgenler) ve Taş Örnekleri Çizimi
            ctx.fillStyle = '#8b4513';
            // Üst sıra üçgenler
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(75 + i * 55, 50);
                ctx.lineTo(100 + i * 55, 300);
                ctx.lineTo(50 + i * 55, 300);
                ctx.fill();
            }

            // Örnek Taşlar (Beyaz ve Siyah)
            // Siyah Taşlar
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(75, 100, 22, 0, Math.PI * 2);
            ctx.arc(75, 150, 22, 0, Math.PI * 2);
            ctx.fill();

            // Beyaz Taşlar
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.arc(75, canvas.height - 100, 22, 0, Math.PI * 2);
            ctx.arc(75, canvas.height - 150, 22, 0, Math.PI * 2);
            ctx.fill();
        }

        drawBoard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backgammon Master Edition - Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030508;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-wrapper {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
        }
        .hud-panel {
            width: 96%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-size: 11px;
            font-weight: 600;
        }
        canvas {
            width: 100%;
            max-height: 74vh;
            aspect-ratio: 900 / 1300;
            background: #0f0703;
            box-shadow: 0 15px 45px rgba(0,0,0,0.95);
            border-radius: 8px;
            border: 2px solid #4a2812;
            cursor: pointer;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn:active { background: #2ea043; }
        .btn-sec { background: #30363d; }
        #status-msg { color: #58a6ff; text-align: center; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div class="hud-panel">
            <span id="score-black">Siyah: 0</span>
            <span id="cube-display">Küp: 1</span>
            <span id="score-white">Beyaz: 0</span>
        </div>
        
        <canvas id="masterCanvas" width="900" height="1300"></canvas>
        
        <div class="hud-panel">
            <button class="btn" id="rollDiceBtn">Zar At</button>
            <span id="status-msg">Zar Bekleniyor</span>
            <button class="btn btn-sec" id="soundToggle">Ses: Açık</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('masterCanvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('status-msg');
        const rollDiceBtn = document.getElementById('rollDiceBtn');
        const soundToggle = document.getElementById('soundToggle');
        const scoreWhiteEl = document.getElementById('score-white');
        const scoreBlackEl = document.getElementById('score-black');
        const cubeDisplayEl = document.getElementById('cube-display');

        let soundEnabled = true;
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynthSound(type) {
            if (!soundEnabled) return;
            initAudioContext();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'dice') {
                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                } else {
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
                }
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = `Ses: ${soundEnabled ? 'Açık' : 'Kapalı'}`;
        });

        // 24 Haneli Tavla Matrisi
        let board = new Array(24).fill(0);
        board[0] = 2;   board[5] = -5;  board[7] = -3;  board[11] = 5;
        board[12] = -5; board[16] = 3;  board[18] = 5;  board[23] = -2;

        let turn = 'white';
        let dice = [];
        let selectedPoint = null;
        let scores = { white: 0, black: 0 };
        let doublingCube = 1;

        function drawMasterBoard() {
            // Ahşap Dış Kasa
            ctx.fillStyle = '#140803';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tablalar Arka Planı
            ctx.fillStyle = '#c89d4c';
            ctx.fillRect(40, 40, 380, 1220);
            ctx.fillRect(480, 40, 380, 1220);

            // Orta Bar
            ctx.fillStyle = '#261106';
            ctx.fillRect(420, 40, 60, 1220);

            // Üçgenler (Haneler)
            const triWidth = 63.3;
            const triHeight = 420;

            for (let i = 0; i < 12; i++) {
                let x = i < 6 ? 40 + i * triWidth : 480 + (i - 6) * triWidth;
                let c1 = (i % 2 === 0) ? '#7a3e12' : '#f5d69c';
                let c2 = (i % 2 === 0) ? '#f5d69c' : '#7a3e12';
                ctx.fillStyle = i < 6 ? c1 : c2;
                ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x + triWidth / 2, 40 + triHeight); ctx.lineTo(x + triWidth, 40); ctx.closePath(); ctx.fill();
            }

            for (let i = 0; i < 12; i++) {
                let x = i < 6 ? 480 + (5 - i) * triWidth : 40 + (11 - i) * triWidth;
                let c1 = (i % 2 === 0) ? '#f5d69c' : '#7a3e12';
                let c2 = (i % 2 === 0) ? '#7a3e12' : '#f5d69c';
                ctx.fillStyle = i < 6 ? c1 : c2;
                ctx.beginPath(); ctx.moveTo(x, 1260); ctx.lineTo(x + triWidth / 2, 1260 - triHeight); ctx.lineTo(x + triWidth, 1260); ctx.closePath(); ctx.fill();
            }

            renderCheckersAndGuides();
        }

        function getPointCoords(i) {
            let x, yBase, isTop = i < 12;
            if (i < 6) { x = 40 + i * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            else if (i < 12) { x = 480 + (i - 6) * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            else if (i < 18) { x = 480 + (17 - i) * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            else { x = 40 + (23 - i) * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            return { x, yBase, isTop };
        }

        function renderCheckersAndGuides() {
            if (selectedPoint !== null) {
                let coords = getPointCoords(selectedPoint);
                ctx.strokeStyle = '#58a6ff';
                ctx.lineWidth = 6;
                ctx.strokeRect(coords.x - 34, coords.isTop ? 35 : 1155, 68, 110);
            }

            for (let i = 0; i < 24; i++) {
                let count = board[i];
                if (count === 0) continue;
                let coords = getPointCoords(i);
                let absCount = Math.abs(count);

                for (let j = 0; j < Math.min(absCount, 5); j++) {
                    let y = coords.isTop ? (coords.yBase + j * 55) : (coords.yBase - j * 55);
                    let grad = ctx.createRadialGradient(coords.x - 6, y - 6, 4, coords.x, y, 26);
                    if (count > 0) {
                        grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#cccccc');
                    } else {
                        grad.addColorStop(0, '#444444'); grad.addColorStop(1, '#111111');
                    }
                    ctx.beginPath(); ctx.arc(coords.x, y, 26, 0, Math.PI * 2);
                    ctx.fillStyle = grad; ctx.fill();
                    ctx.lineWidth = selectedPoint === i ? 4 : 2;
                    ctx.strokeStyle = selectedPoint === i ? '#58a6ff' : (count > 0 ? '#999' : '#000');
                    ctx.stroke();
                }
            }
        }

        rollDiceBtn.addEventListener('click', () => {
            initAudioContext();
            playSynthSound('dice');
            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            dice = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
            statusMsg.textContent = `Zar: ${dice.join(', ')} (${turn === 'white' ? 'Beyaz' : 'Siyah'})`;
        });

        canvas.addEventListener('click', (e) => {
            initAudioContext();
            if (dice.length === 0) { statusMsg.textContent = "Önce Zar Atın!"; return; }

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const clickX = (e.clientX - rect.left) * scaleX;

            let clickedPoint = -1;
            let minDst = 999;
            for (let i = 0; i < 24; i++) {
                let coords = getPointCoords(i);
                let dst = Math.abs(clickX - coords.x);
                if (dst < minDst && dst < 50) { minDst = dst; clickedPoint = i; }
            }

            if (clickedPoint === -1) return;

            if (selectedPoint === null) {
                if ((turn === 'white' && board[clickedPoint] > 0) || (turn === 'black' && board[clickedPoint] < 0)) {
                    selectedPoint = clickedPoint;
                    statusMsg.textContent = `Seçilen Hane: ${clickedPoint + 1}`;
                } else {
                    statusMsg.textContent = "Kendi taşınızı seçmelisiniz!";
                }
            } else {
                let diff = turn === 'white' ? (clickedPoint - selectedPoint) : (selectedPoint - clickedPoint);
                if (dice.includes(diff)) {
                    playSynthSound('move');
                    if (turn === 'white') { board[selectedPoint]--; board[clickedPoint]++; }
                    else { board[selectedPoint]++; board[clickedPoint]--; }
                    dice.splice(dice.indexOf(diff), 1);
                    if (dice.length === 0) {
                        turn = turn === 'white' ? 'black' : 'white';
                        statusMsg.textContent = `Sıra: ${turn === 'white' ? 'Beyaz' : 'Siyah'}`;
                    } else {
                        statusMsg.textContent = `Kalan Zar: ${dice.join(', ')}`;
                    }
                } else {
                    statusMsg.textContent = "Geçersiz Hamle (Zar uymuyor)!";
                }
                selectedPoint = null;
            }
            drawMasterBoard();
        });

        drawMasterBoard();
    </script>
</body>
</html>

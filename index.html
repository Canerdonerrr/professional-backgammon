<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Backgammon - Pro Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #06090f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
        }
        canvas {
            width: 100%;
            height: 77vh;
            object-fit: contain;
            background: #150b06;
            box-shadow: 0 12px 35px rgba(0,0,0,0.95);
            border-radius: 8px;
            border: 2px solid #3a2212;
        }
        #ui-panel {
            width: 96%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn:active { background: #2ea043; }
        .btn-sec { background: #30363d; font-size: 12px; }
        #status { font-size: 11px; font-weight: 500; color: #8b949e; text-align: right; max-width: 150px; }
        #dice-display { font-size: 15px; font-weight: bold; color: #58a6ff; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-panel">
            <button class="btn" id="rollBtn">Zar At</button>
            <div id="dice-display">- -</div>
            <button class="btn btn-sec" id="soundBtn">Ses: Açık</button>
            <div id="status">Önce Zar Atın</div>
        </div>
        <canvas id="backgammonCanvas" width="900" height="1300"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('backgammonCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const diceEl = document.getElementById('dice-display');
        const rollBtn = document.getElementById('rollBtn');
        const soundBtn = document.getElementById('soundBtn');

        let soundEnabled = true;

        // Web Audio API ile profesyonel ses efektleri (Zar ve Pul sesleri)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'dice') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'move') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = `Ses: ${soundEnabled ? 'Açık' : 'Kapalı'}`;
        });

        // 24 hane + Kırılan taşlar (Bar)
        let board = new Array(24).fill(0);
        board[0] = 2;   board[5] = -5;  board[7] = -3;  board[11] = 5;
        board[12] = -5; board[16] = 3;  board[18] = 5;  board[23] = -2;
        
        let bar = { white: 0, black: 0 };
        let turn = 'white'; 
        let dice = [];
        let selectedPoint = null;

        function drawBoard() {
            // Ahşap dış çerçeve
            ctx.fillStyle = '#1c0e06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // İç tablalar (Kadife doku tonu)
            ctx.fillStyle = '#c89d4c';
            ctx.fillRect(40, 40, 380, 1220); 
            ctx.fillRect(480, 40, 380, 1220); 

            // Orta Bar (Derinlik efekti)
            ctx.fillStyle = '#32180a';
            ctx.fillRect(420, 40, 60, 1220);

            // Üçgenleri Çiz (3D Gölgeli)
            const triWidth = 63.3;
            const triHeight = 420;

            for (let i = 0; i < 12; i++) {
                let x = i < 6 ? 40 + i * triWidth : 480 + (i - 6) * triWidth;
                let c1 = (i % 2 === 0) ? '#7a3e12' : '#e6be8a';
                let c2 = (i % 2 === 0) ? '#e6be8a' : '#7a3e12';
                ctx.fillStyle = i < 6 ? c1 : c2;
                ctx.beginPath();
                ctx.moveTo(x, 40);
                ctx.lineTo(x + triWidth / 2, 40 + triHeight);
                ctx.lineTo(x + triWidth, 40);
                ctx.closePath();
                ctx.fill();
            }

            for (let i = 0; i < 12; i++) {
                let x = i < 6 ? 480 + (5 - i) * triWidth : 40 + (11 - i) * triWidth;
                let c1 = (i % 2 === 0) ? '#e6be8a' : '#7a3e12';
                let c2 = (i % 2 === 0) ? '#7a3e12' : '#e6be8a';
                ctx.fillStyle = i < 6 ? c1 : c2;
                ctx.beginPath();
                ctx.moveTo(x, 1260);
                ctx.lineTo(x + triWidth / 2, 1260 - triHeight);
                ctx.lineTo(x + triWidth, 1260);
                ctx.closePath();
                ctx.fill();
            }

            drawCheckers();
            drawBarCheckers();
        }

        function getPointCoords(i) {
            let x, yBase, isTop = i < 12;
            if (i < 6) { x = 40 + i * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            else if (i < 12) { x = 480 + (i - 6) * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            else if (i < 18) { x = 480 + (17 - i) * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            else { x = 40 + (23 - i) * 63.3 + 31.6; yBase = isTop ? 70 : 1230; }
            return { x, yBase, isTop };
        }

        function drawCheckers() {
            for (let i = 0; i < 24; i++) {
                let count = board[i];
                if (count === 0) continue;
                let coords = getPointCoords(i);
                let absCount = Math.abs(count);

                for (let j = 0; j < Math.min(absCount, 5); j++) {
                    let y = coords.isTop ? (coords.yBase + j * 55) : (coords.yBase - j * 55);
                    
                    // 3D Pul Efekti (Gradient)
                    let grad = ctx.createRadialGradient(coords.x - 6, y - 6, 4, coords.x, y, 26);
                    if (count > 0) {
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(1, '#cccccc');
                    } else {
                        grad.addColorStop(0, '#444444');
                        grad.addColorStop(1, '#111111');
                    }

                    ctx.beginPath();
                    ctx.arc(coords.x, y, 26, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.lineWidth = selectedPoint === i ? 4 : 2;
                    ctx.strokeStyle = selectedPoint === i ? '#58a6ff' : (count > 0 ? '#999' : '#000');
                    ctx.stroke();
                }
            }
        }

        function drawBarCheckers() {
            // Kırılan taşlar ortada gösterilir
            if (bar.white > 0) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(450, 600, 26, 0, Math.PI * 2); ctx.fill();
                ctx.stroke();
            }
            if (bar.black > 0) {
                ctx.fillStyle = '#111111';
                ctx.beginPath(); ctx.arc(450, 700, 26, 0, Math.PI * 2); ctx.fill();
                ctx.stroke();
            }
        }

        rollBtn.addEventListener('click', () => {
            playSound('dice');
            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            dice = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
            diceEl.textContent = dice.join(' - ');
            statusEl.textContent = `Sıra: ${turn === 'white' ? 'Beyaz' : 'Siyah'}`;
        });

        function handleInteraction(clientX, clientY) {
            if (dice.length === 0) {
                statusEl.textContent = "Önce Zar Atın!";
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            let clickedPoint = -1;
            for (let i = 0; i < 24; i++) {
                let coords = getPointCoords(i);
                if (Math.abs(clickX - coords.x) < 40) {
                    clickedPoint = i;
                    break;
                }
            }

            if (clickedPoint === -1) return;

            if (selectedPoint === null) {
                if ((turn === 'white' && board[clickedPoint] > 0) || (turn === 'black' && board[clickedPoint] < 0)) {
                    selectedPoint = clickedPoint;
                    statusEl.textContent = `Seçilen: ${clickedPoint + 1}. Hedef seç.`;
                }
            } else {
                let diff = turn === 'white' ? (clickedPoint - selectedPoint) : (selectedPoint - clickedPoint);
                
                if (dice.includes(diff)) {
                    playSound('move');
                    if (turn === 'white') {
                        board[selectedPoint]--;
                        board[clickedPoint]++;
                    } else {
                        board[selectedPoint]++;
                        board[clickedPoint]--;
                    }
                    let idx = dice.indexOf(diff);
                    dice.splice(idx, 1);
                    diceEl.textContent = dice.length > 0 ? dice.join(' - ') : '- -';
                    
                    if (dice.length === 0) {
                        turn = turn === 'white' ? 'black' : 'white';
                        statusEl.textContent = `Sıra: ${turn === 'white' ? 'Beyaz' : 'Siyah'}. Zar at.`;
                    } else {
                        statusEl.textContent = `Kalan zar: ${dice.join(', ')}`;
                    }
                } else {
                    statusEl.textContent = "Geçersiz hamle!";
                }
                selectedPoint = null;
            }
            drawBoard();
        }

        canvas.addEventListener('click', (e) => handleInteraction(e.clientX, e.clientY));
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            handleInteraction(touch.clientX, touch.clientY);
        }, { passive: false });

        drawBoard();
    </script>
</body>
</html>

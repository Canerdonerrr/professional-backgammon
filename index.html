<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Backgammon | Ultra HD Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            padding: 12px;
            background: #111827;
            border: 2px solid #334155;
            cursor: pointer;
        }
        canvas { display: block; border-radius: 8px; background: #090d16; }
        .hud {
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
        }
        .hud span {
            color: #f8fafc;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="hud">
        <div>SIRA: <span id="turnIndicator">BEYAZ</span></div>
        <div>ZARLAR: <span id="diceIndicator">Atmak için tıklayın</span></div>
        <div>SEÇİLEN HANE: <span id="selectedIndicator">Yok</span></div>
    </div>
    <div class="game-container">
        <canvas id="boardCanvas" width="1200" height="800"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const BASE_WIDTH = 1200, BASE_HEIGHT = 800;

        let boardState = [
             2,  0,  0,  0,  0, -5, 
             0, -3,  0,  0,  0,  5, 
            -5,  0,  0,  0,  3,  0, 
             5,  0,  0,  0,  0, -2 
        ];

        let turn = 'white'; // 'white' veya 'black'
        let selectedPoint = null;

        function initCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = BASE_WIDTH * dpr;
            canvas.height = BASE_HEIGHT * dpr;
            ctx.scale(dpr, dpr);
        }

        function drawBoard() {
            ctx.fillStyle = '#1c120c';
            ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, BASE_WIDTH - 20, BASE_HEIGHT - 20);

            ctx.fillStyle = '#261710';
            ctx.fillRect(20, 20, BASE_WIDTH - 40, BASE_HEIGHT - 40);

            ctx.fillStyle = '#130b07';
            ctx.fillRect(BASE_WIDTH / 2 - 40, 20, 80, BASE_HEIGHT - 40);

            const triangleWidth = 76;
            const triangleHeight = 280;

            for (let i = 0; i < 12; i++) {
                let x = 40 + i * triangleWidth;
                if (i >= 6) x += 80;

                // Üst sıra
                ctx.fillStyle = (i % 2 === 0) ? '#4a3319' : '#e6d5b8';
                ctx.beginPath();
                ctx.moveTo(x, 20);
                ctx.lineTo(x + triangleWidth / 2, 20 + triangleHeight);
                ctx.lineTo(x + triangleWidth, 20);
                ctx.closePath();
                ctx.fill();

                // Alt sıra
                ctx.fillStyle = (i % 2 === 0) ? '#e6d5b8' : '#4a3319';
                ctx.beginPath();
                ctx.moveTo(x, BASE_HEIGHT - 20);
                ctx.lineTo(x + triangleWidth / 2, BASE_HEIGHT - 20 - triangleHeight);
                ctx.lineTo(x + triangleWidth, BASE_HEIGHT - 20);
                ctx.closePath();
                ctx.fill();
            }

            // Seçilen haneyi vurgula
            if (selectedPoint !== null) {
                highlightPoint(selectedPoint);
            }
        }

        function highlightPoint(index) {
            const triangleWidth = 76;
            let col, x;
            const isTop = index >= 12;
            if (isTop) {
                col = index - 12;
                x = 40 + col * triangleWidth;
                if (col >= 6) x += 80;
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.strokeRect(x, 20, triangleWidth, 320);
            } else {
                col = 11 - index;
                x = 40 + col * triangleWidth;
                if (col >= 6) x += 80;
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.strokeRect(x, BASE_HEIGHT - 340, triangleWidth, 320);
            }
        }

        function drawCheckers() {
            const triangleWidth = 76;
            const radius = 32;

            boardState.forEach((count, index) => {
                if (count === 0) return;
                let col, x, y;
                const isTop = index >= 12;

                if (isTop) {
                    col = index - 12;
                    x = 40 + col * triangleWidth + triangleWidth / 2;
                    if (col >= 6) x += 80;
                    for (let j = 0; j < Math.abs(count); j++) {
                        y = 20 + radius + j * (radius * 1.6);
                        renderSingleChecker(x, y, count > 0 ? 'white' : 'black', radius);
                    }
                } else {
                    col = 11 - index;
                    x = 40 + col * triangleWidth + triangleWidth / 2;
                    if (col >= 6) x += 80;
                    for (let j = 0; j < Math.abs(count); j++) {
                        y = BASE_HEIGHT - 20 - radius - j * (radius * 1.6);
                        renderSingleChecker(x, y, count > 0 ? 'white' : 'black', radius);
                    }
                }
            });
        }

        function renderSingleChecker(x, y, color, radius) {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 4;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(x - 8, y - 8, 5, x, y, radius);
            if (color === 'white') {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(1, '#cbd5e1');
            } else {
                grad.addColorStop(0, '#334155');
                grad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = color === 'white' ? '#94a3b8' : '#1e293b';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
            drawBoard();
            drawCheckers();
        }

        // Tıklama Algılama (Hane Seçimi)
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = BASE_WIDTH / rect.width;
            const scaleY = BASE_HEIGHT / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            // Orta bar kontrolü
            if (mouseX >= BASE_WIDTH / 2 - 40 && mouseX <= BASE_WIDTH / 2 + 40) return;

            const triangleWidth = 76;
            let clickedIndex = -1;

            if (mouseY < BASE_HEIGHT / 2) {
                // Üst sıra (12 - 23)
                let adjustedX = mouseX > BASE_WIDTH / 2 ? mouseX - 80 : mouseX;
                let col = Math.floor((adjustedX - 40) / triangleWidth);
                if (col >= 0 && col < 12) clickedIndex = 12 + col;
            } else {
                // Alt sıra (0 - 11)
                let adjustedX = mouseX > BASE_WIDTH / 2 ? mouseX - 80 : mouseX;
                let col = Math.floor((adjustedX - 40) / triangleWidth);
                if (col >= 0 && col < 12) clickedIndex = 11 - col;
            }

            if (clickedIndex !== -1) {
                if (selectedPoint === null) {
                    if ((turn === 'white' && boardState[clickedIndex] > 0) || 
                        (turn === 'black' && boardState[clickedIndex] < 0)) {
                        selectedPoint = clickedIndex;
                        document.getElementById('selectedIndicator').innerText = clickedIndex + 1;
                    }
                } else {
                    // Basit taşıma simülasyonu
                    if (turn === 'white' && boardState[selectedPoint] > 0) {
                        boardState[selectedPoint] -= 1;
                        boardState[clickedIndex] += 1;
                    } else if (turn === 'black' && boardState[selectedPoint] < 0) {
                        boardState[selectedPoint] += 1;
                        boardState[clickedIndex] -= 1;
                    }
                    selectedPoint = null;
                    document.getElementById('selectedIndicator').innerText = "Yok";
                    turn = turn === 'white' ? 'black' : 'white';
                    document.getElementById('turnIndicator').innerText = turn.toUpperCase();
                }
                render();
            }
        });

        initCanvas();
        render();
    </script>
</body>
</html>

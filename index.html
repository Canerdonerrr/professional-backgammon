<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Backgammon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a0f08;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="backgammonCanvas" width="900" height="1400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('backgammonCanvas');
        const ctx = canvas.getContext('2d');

        function drawBoard() {
            // Tahta Dış Çerçevesi
            ctx.fillStyle = '#2c160b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sağ ve Sol Tablalar (Zemin)
            ctx.fillStyle = '#dcb35c';
            // Sol Tabla
            ctx.fillRect(40, 40, 380, 1320);
            // Sağ Tabla
            ctx.fillRect(480, 40, 380, 1320);

            // Orta Bar
            ctx.fillStyle = '#4a2511';
            ctx.fillRect(420, 40, 60, 1320);

            // Üçgenleri Çizme Fonksiyonu
            function drawTriangle(x, width, height, topDown, color1, color2, index) {
                ctx.fillStyle = (index % 2 === 0) ? color1 : color2;
                ctx.beginPath();
                if (topDown) {
                    ctx.moveTo(x, 40);
                    ctx.lineTo(x + width / 2, 40 + height);
                    ctx.lineTo(x + width, 40);
                } else {
                    ctx.moveTo(x, 1360);
                    ctx.lineTo(x + width / 2, 1360 - height);
                    ctx.lineTo(x + width, 1360);
                }
                ctx.closePath();
                ctx.fill();
            }

            const triWidth = 63.3;
            const triHeight = 450;
            const c1 = '#8b4513';
            const c2 = '#f4a460';

            // Sol üst 6 üçgen
            for (let i = 0; i < 6; i++) {
                drawTriangle(40 + i * triWidth, triWidth, triHeight, true, c1, c2, i);
            }
            // Sağ üst 6 üçgen
            for (let i = 0; i < 6; i++) {
                drawTriangle(480 + i * triWidth, triWidth, triHeight, true, c2, c1, i);
            }
            // Sol alt 6 üçgen
            for (let i = 0; i < 6; i++) {
                drawTriangle(40 + i * triWidth, triWidth, triHeight, false, c2, c1, i);
            }
            // Sağ alt 6 üçgen
            for (let i = 0; i < 6; i++) {
                drawTriangle(480 + i * triWidth, triWidth, triHeight, false, c1, c2, i);
            }
        }

        drawBoard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Backgammon | Ultra HD Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            padding: 12px;
            background: #111827;
            border: 2px solid #334155;
        }
        canvas { display: block; border-radius: 8px; background: #090d16; }
        .hud {
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
        }
        .hud span {
            color: #f8fafc;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="hud">
        <div>SIRA: <span id="turnIndicator">BEYAZ</span></div>
        <div>ZARLAR: <span id="diceIndicator">- , -</span></div>
        <div>BEYAZ PİP: <span id="whitePip">167</span></div>
        <div>SİYAH PİP: <span id="blackPip">167</span></div>
    </div>
    <div class="game-container">
        <canvas id="boardCanvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const BASE_WIDTH = 1200, BASE_HEIGHT = 800;

        // 24 haneli tahta dizilimi (Pozitif: Beyaz, Negatif: Siyah)
        const boardState = [
             2,  0,  0,  0,  0, -5,  // 1 - 6
             0, -3,  0,  0,  0,  5,  // 7 - 12
            -5,  0,  0,  0,  3,  0,  // 13 - 18
             5,  0,  0,  0,  0, -2   // 19 - 24
        ];

        function initCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = BASE_WIDTH * dpr;
            canvas.height = BASE_HEIGHT * dpr;
            canvas.style.width = `${BASE_WIDTH * 0.85}px`;
            canvas.style.height = `${BASE_HEIGHT * 0.85}px`;
            ctx.scale(dpr, dpr);
        }

        function drawBoard() {
            // Arka Plan / Çerçeve
            ctx.fillStyle = '#1c120c';
            ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, BASE_WIDTH - 20, BASE_HEIGHT - 20);

            ctx.fillStyle = '#261710';
            ctx.fillRect(20, 20, BASE_WIDTH - 40, BASE_HEIGHT - 40);

            // Orta Bar
            ctx.fillStyle = '#130b07';
            ctx.fillRect(BASE_WIDTH / 2 - 40, 20, 80, BASE_HEIGHT - 40);

            // Üçgenler (Haneler)
            const triangleWidth = 76;
            const triangleHeight = 280;

            for (let i = 0; i < 12; i++) {
                let x = 40 + i * triangleWidth;
                if (i >= 6) x += 80;

                // Üst sıra
                ctx.fillStyle = (i % 2 === 0) ? '#4a3319' : '#e6d5b8';
                ctx.beginPath();
                ctx.moveTo(x, 20);
                ctx.lineTo(x + triangleWidth / 2, 20 + triangleHeight);
                ctx.lineTo(x + triangleWidth, 20);
                ctx.closePath();
                ctx.fill();

                // Alt sıra
                ctx.fillStyle = (i % 2 === 0) ? '#e6d5b8' : '#4a3319';
                ctx.beginPath();
                ctx.moveTo(x, BASE_HEIGHT - 20);
                ctx.lineTo(x + triangleWidth / 2, BASE_HEIGHT - 20 - triangleHeight);
                ctx.lineTo(x + triangleWidth, BASE_HEIGHT - 20);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawCheckers() {
            const triangleWidth = 76;
            const radius = 32;

            boardState.forEach((count, index) => {
                if (count === 0) return;

                let col, row, x, y;
                const isTop = index >= 12;

                if (isTop) {
                    // Üst yarı (12 ila 23 indexleri)
                    let realIndex = index - 12; // 0'dan 11'e
                    col = realIndex;
                    x = 40 + col * triangleWidth + triangleWidth / 2;
                    if (col >= 6) x += 80;

                    for (let j = 0; j < Math.abs(count); j++) {
                        y = 20 + radius + j * (radius * 1.6);
                        renderSingleChecker(x, y, count > 0 ? 'white' : 'black', radius);
                    }
                } else {
                    // Alt yarı (0 ila 11 indexleri)
                    let realIndex = 11 - index; // Sağdan sola dizilim için
                    col = realIndex;
                    x = 40 + col * triangleWidth + triangleWidth / 2;
                    if (col >= 6) x += 80;

                    for (let j = 0; j < Math.abs(count); j++) {
                        y = BASE_HEIGHT - 20 - radius - j * (radius * 1.6);
                        renderSingleChecker(x, y, count > 0 ? 'white' : 'black', radius);
                    }
                }
            });
        }

        function renderSingleChecker(x, y, color, radius) {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 4;

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            
            // Profesyonel Gradyan Dolgu
            let grad = ctx.createRadialGradient(x - 8, y - 8, 5, x, y, radius);
            if (color === 'white') {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(1, '#cbd5e1');
            } else {
                grad.addColorStop(0, '#334155');
                grad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.strokeStyle = color === 'white' ? '#94a3b8' : '#1e293b';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
            drawBoard();
            drawCheckers();
        }

        initCanvas();
        render();
    </script>
</body>
</html>
